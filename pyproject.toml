[tool.poetry]
name = "diffscribe"
version = "0.1.0"
description = "AI-powered pull request intelligence assistant."
authors = ["MessaoudDev <dev@diffscribe.local>"]
readme = "README.md"
license = "MIT"
keywords = ["pull requests", "ai", "summaries", "github"]
packages = [{ include = "diffscribe" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
PyGithub = ">=2.3.0,<3.0.0"
openai = ">=1.3.0,<2.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
requests = ">=2.31.0,<3.0.0"
PyYAML = ">=6.0.0,<7.0.0"
tree-sitter = ">=0.20.1,<0.21.0"
typing-extensions = ">=4.8.0,<5.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0,<9.0.0"

[tool.poetry.scripts]
diffscribe = "diffscribe.cli:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

